<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Stylus Glow Gradient -->
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Squircle App Icon -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Notebook Sheet -->
  <rect x="12" y="12" width="40" height="40" rx="7" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Notebook Spine Stitching / Ring Binders -->
  <line x1="20" y1="12" x2="20" y2="52" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Ruled Notebook Page Lines -->
  <line x1="24" y1="21" x2="44" y2="21" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="29" x2="40" y2="29" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="37" x2="36" y2="37" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Drawing Wave / Ink Stroke -->
  <path d="M 23 44 C 30 38, 36 47, 44 38" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Digital Stylus Pen Tip drawing the ink -->
  <g transform="translate(43, 26) rotate(45)">
    <rect x="-3" y="-12" width="6" height="16" rx="2" fill="url(#penGrad)" />
    <path d="M -3 4 L 3 4 L 0 9 Z" fill="#0284c7" />
    <circle cx="0" cy="9.5" r="1.2" fill="#38bdf8" />
  </g>
</svg>
